{{- if .Values.trainingHub.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todea.trainingHub.name" . }}
  labels:
    {{- include "todea.labels" . | nindent 4 }}
    app.kubernetes.io/component: training-hub
spec:
  type: {{ .Values.trainingHub.service.type }}
  selector:
    {{- include "todea.trainingHub.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.trainingHub.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
